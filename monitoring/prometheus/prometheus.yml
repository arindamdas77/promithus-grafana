global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:

  # =========================
  # SERVER MONITORING
  # =========================

  - job_name: "server-01"
    static_configs:
      - targets:
          - "89.116.32.43:9100"
        labels:
          server: "Maxbridge Development Server"
          environment: "development"

  - job_name: "server-02"
    static_configs:
      - targets:
          - "46.28.44.148:9100"
        labels:
          server: "Dhellavita"
          environment: "production"

  - job_name: "server-03"
    static_configs:
      - targets:
          - "187.127.135.132:9100"
        labels:
          server: "Citysync"
          environment: "production"


  # =========================
  # WEBSITE MONITORING
  # =========================

  - job_name: "blackbox-http"
    scrape_interval: 30s
    scrape_timeout: 20s

    metrics_path: /probe

    params:
      module:
        - http_2xx

    file_sd_configs:
      - files:
          - /etc/prometheus/blackbox/targets.yml
        refresh_interval: 1m

    relabel_configs:

      # Original website URL
      - source_labels:
          - __address__
        target_label: __param_target

      # Store website URL as instance
      - source_labels:
          - __param_target
        target_label: instance

      # Store website URL as target
      - source_labels:
          - __param_target
        target_label: target

      # Send probe request to Blackbox Exporter
      - target_label: __address__
        replacement: blackbox-exporter:9115


  # =========================
  # MONITORING STACK
  # =========================

  - job_name: "prometheus"
    static_configs:
      - targets:
          - "localhost:9090"
        labels:
          service: "prometheus"
          server: "monitoring-host"
          environment: "monitoring"

  - job_name: "blackbox-exporter"
    static_configs:
      - targets:
          - "blackbox-exporter:9115"
        labels:
          service: "blackbox-exporter"
          server: "monitoring-host"
          environment: "monitoring"

  - job_name: "alertmanager"
    static_configs:
      - targets:
          - "alertmanager:9093"
        labels:
          service: "alertmanager"
          server: "monitoring-host"
          environment: "monitoring"

  - job_name: "grafana"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "grafana:3000"
        labels:
          service: "grafana"
          server: "monitoring-host"
          environment: "monitoring"

  - job_name: "loki"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "loki:3100"
        labels:
          service: "loki"
          server: "monitoring-host"
          environment: "monitoring"
