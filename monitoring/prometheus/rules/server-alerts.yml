groups:

  # ==========================================================
  # SERVER AVAILABILITY
  # ==========================================================
  - name: server-availability
    interval: 30s

    rules:

      - alert: ServerDown
        expr: up{instance=~".*:9100"} == 0
        for: 2m

        labels:
          severity: critical
          category: availability

        annotations:
          summary: "Server {{ $labels.server }} is down"
          description: "Server {{ $labels.server }} ({{ $labels.instance }}) has been unreachable for more than 2 minutes."


      - alert: NodeExporterDown
        expr: up{instance=~".*:9100"} == 0
        for: 2m

        labels:
          severity: critical
          category: monitoring

        annotations:
          summary: "Node Exporter is down on {{ $labels.server }}"
          description: "Prometheus cannot scrape Node Exporter on {{ $labels.server }} ({{ $labels.instance }})."


  # ==========================================================
  # CPU
  # ==========================================================
  - name: server-cpu
    interval: 30s

    rules:

      - alert: HighCPU
        expr: |
          100 -
          (
            avg by (server, instance) (
              rate(node_cpu_seconds_total{
                mode="idle"
              }[10m])
            ) * 100
          ) > 80

        for: 10m

        labels:
          severity: warning
          category: cpu

        annotations:
          summary: "High CPU usage on {{ $labels.server }}"
          description: "CPU usage on {{ $labels.server }} has been above 80% for more than 10 minutes."


      - alert: CriticalCPU
        expr: |
          100 -
          (
            avg by (server, instance) (
              rate(node_cpu_seconds_total{
                mode="idle"
              }[10m])
            ) * 100
          ) > 95

        for: 5m

        labels:
          severity: critical
          category: cpu

        annotations:
          summary: "Critical CPU usage on {{ $labels.server }}"
          description: "CPU usage on {{ $labels.server }} has been above 95% for more than 5 minutes."


  # ==========================================================
  # MEMORY
  # ==========================================================
  - name: server-memory
    interval: 30s

    rules:

      - alert: HighMemory
        expr: |
          (
            1 -
            (
              node_memory_MemAvailable_bytes
              /
              node_memory_MemTotal_bytes
            )
          ) * 100 > 80

        for: 10m

        labels:
          severity: warning
          category: memory

        annotations:
          summary: "High memory usage on {{ $labels.server }}"
          description: "Memory usage on {{ $labels.server }} has been above 80% for more than 10 minutes."


      - alert: CriticalMemory
        expr: |
          (
            1 -
            (
              node_memory_MemAvailable_bytes
              /
              node_memory_MemTotal_bytes
            )
          ) * 100 > 90

        for: 5m

        labels:
          severity: critical
          category: memory

        annotations:
          summary: "Critical memory usage on {{ $labels.server }}"
          description: "Memory usage on {{ $labels.server }} has been above 90% for more than 5 minutes."


  # ==========================================================
  # DISK
  # ==========================================================
  - name: server-disk
    interval: 30s

    rules:

      - alert: HighDisk
        expr: |
          (
            1 -
            (
              node_filesystem_avail_bytes{
                job=~"server-0[123]",
                fstype!~"tmpfs|devtmpfs|overlay|squashfs|aufs",
                mountpoint!~"/boot/efi"
              }
              /
              node_filesystem_size_bytes{
                job=~"server-0[123]",
                fstype!~"tmpfs|devtmpfs|overlay|squashfs|aufs",
                mountpoint!~"/boot/efi"
              }
            )
          ) * 100 > 80

        for: 10m

        labels:
          severity: warning
          category: disk

        annotations:
          summary: "High disk usage on {{ $labels.server }} ({{ $labels.mountpoint }})"
          description: "Filesystem {{ $labels.mountpoint }} on {{ $labels.server }} has been above 80% for more than 10 minutes."


      - alert: CriticalDisk
        expr: |
          (
            1 -
            (
              node_filesystem_avail_bytes{
                job=~"server-0[123]",
                fstype!~"tmpfs|devtmpfs|overlay|squashfs|aufs",
                mountpoint!~"/boot/efi"
              }
              /
              node_filesystem_size_bytes{
                job=~"server-0[123]",
                fstype!~"tmpfs|devtmpfs|overlay|squashfs|aufs",
                mountpoint!~"/boot/efi"
              }
            )
          ) * 100 > 90

        for: 5m

        labels:
          severity: critical
          category: disk

        annotations:
          summary: "Critical disk usage on {{ $labels.server }} ({{ $labels.mountpoint }})"
          description: "Filesystem {{ $labels.mountpoint }} on {{ $labels.server }} has been above 90% for more than 5 minutes."


      - alert: DiskFillingSoon
        expr: |
          (
            node_filesystem_avail_bytes{
              job=~"server-0[123]",
              fstype!~"tmpfs|devtmpfs|overlay|squashfs|aufs",
              mountpoint!~"/boot/efi"
            }
            /
            (
              -delta(
                node_filesystem_avail_bytes{
                  job=~"server-0[123]",
                  fstype!~"tmpfs|devtmpfs|overlay|squashfs|aufs",
                  mountpoint!~"/boot/efi"
                }[6h]
              ) * 4
            )
          ) < 14
          and
          (
            -delta(
              node_filesystem_avail_bytes{
                job=~"server-0[123]",
                fstype!~"tmpfs|devtmpfs|overlay|squashfs|aufs",
                mountpoint!~"/boot/efi"
              }[6h]
            ) > 0
          )

        for: 1h

        labels:
          severity: warning
          category: disk

        annotations:
          summary: "Disk filling on {{ $labels.server }} ({{ $labels.mountpoint }})"
          description: "At the last 6 hours of growth, {{ $labels.mountpoint }} on {{ $labels.server }} runs out of space in under 14 days."


  # ==========================================================
  # LOAD
  # ==========================================================
  - name: server-load
    interval: 30s

    rules:

      - alert: HighLoad
        expr: |
          node_load1{job=~"server-0[123]"}
          / on(server, instance) group_left
          count by (server, instance) (
            node_cpu_seconds_total{
              job=~"server-0[123]",
              mode="idle"
            }
          )
          > 1.5

        for: 10m

        labels:
          severity: warning
          category: load

        annotations:
          summary: "High system load on {{ $labels.server }}"
          description: "1-minute load average is significantly above available CPU capacity on {{ $labels.server }}."


  # ==========================================================
  # SWAP
  # ==========================================================
  - name: server-swap
    interval: 30s

    rules:

      - alert: HighSwap
        expr: |
          (
            1 -
            (
              node_memory_SwapFree_bytes
              /
              node_memory_SwapTotal_bytes
            )
          ) * 100 > 50
          and
          node_memory_SwapTotal_bytes > 0

        for: 10m

        labels:
          severity: warning
          category: swap

        annotations:
          summary: "High swap usage on {{ $labels.server }}"
          description: "Swap usage on {{ $labels.server }} has been above 50% for more than 10 minutes."


  # ==========================================================
  # SERVICES
  # ==========================================================
  - name: server-services
    interval: 30s

    rules:

      - alert: ServiceFailed
        expr: |
          node_systemd_unit_state{
            job=~"server-0[123]",
            name=~"apache2.service|nginx.service|mysql.service|mariadb.service|postgresql@16-main.service|docker.service|php8.2-fpm.service|php8.3-fpm.service|php8.4-fpm.service|redis.service|redis-server.service|ssh.service",
            state="failed"
          } == 1
        for: 2m
        labels:
          severity: critical
          category: service
        annotations:
          summary: "{{ $labels.name }} failed on {{ $labels.server }}"
          description: "{{ $labels.name }} on {{ $labels.server }} has been in a failed state for more than 2 minutes."

      - alert: ServiceStopped
        expr: |
          node_systemd_unit_state{
            job=~"server-0[123]",
            name=~"apache2.service|nginx.service|mysql.service|mariadb.service|postgresql@16-main.service|docker.service|php8.2-fpm.service|php8.3-fpm.service|php8.4-fpm.service|redis.service|redis-server.service|ssh.service",
            state="inactive"
          } == 1
        for: 10m
        labels:
          severity: warning
          category: service
        annotations:
          summary: "{{ $labels.name }} is stopped on {{ $labels.server }}"
          description: "{{ $labels.name }} is installed on {{ $labels.server }} but has been stopped for more than 10 minutes."


  # ==========================================================
  # NETWORK, PROCESSES, STALE DATA, REBOOT
  # ==========================================================
  - name: server-network
    interval: 30s

    rules:

      - alert: NetworkErrors
        expr: |
          sum by (server, instance) (
            rate(node_network_receive_errs_total{job=~"server-0[123]",device!~"lo|veth.*|docker.*|br-.*"}[5m])
            +
            rate(node_network_transmit_errs_total{job=~"server-0[123]",device!~"lo|veth.*|docker.*|br-.*"}[5m])
          ) > 1
        for: 10m
        labels:
          severity: warning
          category: network
        annotations:
          summary: "Network errors on {{ $labels.server }}"
          description: "Network errors on {{ $labels.server }} have stayed above 1 per second for more than 10 minutes."

      - alert: ZombieProcesses
        expr: |
          sum by (server, instance) (
            node_processes_state{job=~"server-0[123]",state="Z"}
          ) >= 10
        for: 10m
        labels:
          severity: warning
          category: process
        annotations:
          summary: "Many zombie processes on {{ $labels.server }}"
          description: "{{ $labels.server }} has had 10 or more zombie processes for more than 10 minutes."

      - alert: MonitoringDataStale
        expr: |
          (time() - timestamp(up{job=~"server-0[123]"})) > 120
        for: 2m
        labels:
          severity: warning
          category: monitoring
        annotations:
          summary: "Monitoring data is stale on {{ $labels.server }}"
          description: "The latest Node Exporter sample for {{ $labels.server }} is more than 2 minutes old."

      - alert: ServerRebooted
        expr: |
          changes(node_boot_time_seconds{job=~"server-0[123]"}[30m]) > 0
        for: 1m
        labels:
          severity: warning
          category: availability
        annotations:
          summary: "{{ $labels.server }} rebooted"
          description: "{{ $labels.server }} booted during the last 30 minutes. Confirm the restart was planned and that services came back."
