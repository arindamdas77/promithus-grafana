---
- name: Verify Grafana provisioning without replacing live dashboards
  hosts: localhost
  connection: local
  become: false
  gather_facts: false

  vars:
    monitoring_dir: "{{ playbook_dir }}/../monitoring"

  tasks:
    - name: Confirm provisioning files
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ monitoring_dir }}/grafana/provisioning/datasources/prometheus.yml"
        - "{{ monitoring_dir }}/grafana/provisioning/dashboards/dashboards.yml"
        - "{{ monitoring_dir }}/grafana/dashboards/infrastructure-overview.json"
        - "{{ monitoring_dir }}/grafana/dashboards/server-detail.json"
        - "{{ monitoring_dir }}/grafana/dashboards/website-monitoring.json"
        - "{{ monitoring_dir }}/grafana/dashboards/alerts-logs.json"
      register: provisioning_files

    - name: Require provisioning files
      ansible.builtin.assert:
        that:
          - item.stat.exists
        fail_msg: "Missing {{ item.item }}"
      loop: "{{ provisioning_files.results }}"

    - name: Confirm Grafana is running
      ansible.builtin.command:
        argv:
          - docker
          - ps
          - --filter
          - name=grafana
          - --format
          - "{{ '{{.Names}}' }}"
      register: grafana_ps
      changed_when: false

    - name: Grafana container must be present
      ansible.builtin.assert:
        that:
          - grafana_ps.stdout is search('grafana')
        fail_msg: "Grafana container is not running. Run playbooks/08_monitoring_stack.yml."

    - name: Remind operators where dashboards are provisioned from
      ansible.builtin.debug:
        msg: "Dashboards are file-provisioned from monitoring/grafana/dashboards. Existing Grafana users and grafana_data are not reset."
