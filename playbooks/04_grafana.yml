---
- name: Deploy Grafana
  hosts: localhost
  connection: local
  become: false
  gather_facts: true

  vars:
    monitoring_dir: "{{ playbook_dir }}/../monitoring"
    repo_env: "{{ playbook_dir }}/../.env"
    compose_services:
      - grafana
    compose_cmd: "{{ ['docker', 'compose', '--env-file', repo_env] if (lookup('ansible.builtin.file', repo_env, errors='ignore') | length) > 0 else ['docker', 'compose'] }}"

  tasks:
    - ansible.builtin.include_tasks: tasks/compose_up.yml
