---
- name: Check operating system
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family == "Debian"
    fail_msg: "This Node Exporter role currently supports Debian/Ubuntu systems."

- name: Install required packages
  ansible.builtin.apt:
    name:
      - curl
      - tar
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create Node Exporter group
  ansible.builtin.group:
    name: "{{ node_exporter_group }}"
    system: true
    state: present

- name: Create Node Exporter user
  ansible.builtin.user:
    name: "{{ node_exporter_user }}"
    group: "{{ node_exporter_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: /nonexistent
    create_home: false
    state: present

- name: Create temporary directory
  ansible.builtin.file:
    path: /tmp/node_exporter_install
    state: directory
    mode: "0755"

- name: Download Node Exporter
  ansible.builtin.get_url:
    url: "{{ node_exporter_download_url }}"
    dest: "/tmp/node_exporter_install/node_exporter.tar.gz"
    mode: "0644"
    timeout: 60

- name: Extract Node Exporter
  ansible.builtin.unarchive:
    src: "/tmp/node_exporter_install/node_exporter.tar.gz"
    dest: "/tmp/node_exporter_install"
    remote_src: true
    creates: "/tmp/node_exporter_install/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"

- name: Install Node Exporter binary
  ansible.builtin.copy:
    src: "/tmp/node_exporter_install/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"
    dest: "{{ node_exporter_install_dir }}/node_exporter"
    owner: root
    group: root
    mode: "0755"
    remote_src: true
  notify: Restart Node Exporter

- name: Create systemd service
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart Node Exporter

- name: Enable and start Node Exporter
  ansible.builtin.systemd:
    name: node_exporter
    enabled: true
    state: started
    daemon_reload: true

- name: Verify Node Exporter service
  ansible.builtin.systemd:
    name: node_exporter
  register: node_exporter_service

- name: Display Node Exporter status
  ansible.builtin.debug:
    msg:
      - "Server: {{ inventory_hostname }}"
      - "Node Exporter: {{ node_exporter_service.status.ActiveState }}"
      - "Port: {{ node_exporter_port }}"
